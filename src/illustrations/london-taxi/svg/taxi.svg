<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250">
  <title>London taxi (side view, facing right)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4656"/><stop offset=".16" stop-color="#262d3a"/><stop offset=".55" stop-color="#1b2029"/><stop offset="1" stop-color="#10141b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46607f"/><stop offset=".5" stop-color="#263a57"/><stop offset="1" stop-color="#172236"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f5"/><stop offset=".5" stop-color="#b9c0c6"/><stop offset="1" stop-color="#7e868e"/></linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8"/><stop offset="1" stop-color="#eebe5e"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e9eb"/><stop offset="1" stop-color="#868e96"/></linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06080c" stop-opacity="0"/><stop offset="1" stop-color="#06080c" stop-opacity=".6"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#0d1320" stop-opacity=".5"/><stop offset=".6" stop-color="#0d1320" stop-opacity=".22"/><stop offset="1" stop-color="#0d1320" stop-opacity="0"/></radialGradient>
    <path id="bodyShape" d="M58 186 C49 181 46 170 46 158 L47 118 C48 104 54 96 66 92 L78 89 C80 66 90 50 116 45 L306 42 C328 42 340 52 348 68 L363 105 C400 107 436 112 458 122 C478 131 488 146 488 163 L488 178 C488 186 482 189 474 189 L66 189 C62 189 60 188 58 186 Z"/>
    <clipPath id="clipBody"><use href="#bodyShape"/></clipPath>
  </defs>

  <!-- ground contact -->
  <ellipse cx="272" cy="232" rx="262" ry="13" fill="url(#shadow)"/>
  <rect x="70" y="170" width="402" height="30" rx="9" fill="#06080b"/>

  <!-- bodywork -->
  <use href="#bodyShape" fill="url(#body)"/>
  <g clip-path="url(#clipBody)">
    <rect x="40" y="148" width="460" height="44" fill="url(#sill)"/>
    <rect x="40" y="88" width="460" height="22" fill="#fff" opacity=".05"/>
    <path d="M360 108 C398 110 436 114 460 124 L460 150 L360 150 Z" fill="url(#sheen)"/>
    <path d="M98 112 L238 112 L238 168 L98 168 Z" fill="url(#sheen)" opacity=".55"/>
  </g>
  <!-- beltline, roof and wing highlights -->
  <path d="M50 112 C160 107 320 106 478 128" fill="none" stroke="#586175" stroke-width="2" opacity=".75" stroke-linecap="round"/>
  <path d="M120 46 L304 43" fill="none" stroke="#8793a8" stroke-width="2.6" opacity=".55" stroke-linecap="round"/>
  <path d="M80 86 C82 68 92 54 114 48" fill="none" stroke="#5a657a" stroke-width="2" opacity=".6" stroke-linecap="round"/>
  <path d="M372 108 C408 110 440 117 462 130" fill="none" stroke="#c9d3e3" stroke-width="3" opacity=".22" stroke-linecap="round"/>
  <!-- door shut lines -->
  <g fill="none" stroke="#05070a" stroke-width="1.6" opacity=".8" stroke-linecap="round">
    <path d="M96 108 L94 172"/><path d="M241 108 L241 172"/><path d="M256 108 L256 172"/><path d="M360 108 C364 134 366 154 368 172"/><path d="M94 173 L368 173" opacity=".6"/><path d="M372 107 C400 111 430 118 460 130" opacity=".5"/>
  </g>
  <!-- windows: black trim, glass, faceless occupants, reflections -->
  <g stroke="#080b10" stroke-width="5" stroke-linejoin="round" fill="url(#glass)">
    <path d="M92 104 L95 78 C97 64 105 57 124 55 L240 54 L240 104 Z"/>
    <path d="M256 104 L256 54 L306 53 C322 53 332 61 338 74 L350 104 Z"/>
  </g>
  <g fill="#0e1623" opacity=".9">
    <ellipse cx="170" cy="80" rx="11" ry="13.5"/><path d="M146 104 C148 91 159 89 170 90 C182 90 192 92 195 104 Z"/>
    <ellipse cx="297" cy="80" rx="10" ry="12.5"/><path d="M276 104 C278 92 288 90 297 91 C307 91 313 93 315 104 Z"/>
  </g>
  <g fill="#f1e8d8">
    <path d="M104 104 L126 104 L158 57 L134 58 Z" opacity=".13"/><path d="M196 104 L208 104 L232 55 L221 55 Z" opacity=".09"/>
    <path d="M263 104 L278 104 L302 55 L287 55 Z" opacity=".13"/>
  </g>
  <path d="M92 104 L350 104" stroke="#05070a" stroke-width="2" opacity=".6"/>
  <!-- door handles -->
  <rect x="208" y="113" width="22" height="6" rx="3" fill="url(#chrome)"/><rect x="326" y="113" width="22" height="6" rx="3" fill="url(#chrome)"/>
  <!-- wing mirror -->
  <path d="M356 103 L350 112" stroke="#080b10" stroke-width="3" stroke-linecap="round"/><rect x="350" y="92" width="18" height="10" rx="5" fill="#080b10"/>

  <!-- wheel arches -->
  <g fill="#07090d"><path d="M104 189 A46 46 0 0 1 196 189 Z"/><path d="M338 189 A46 46 0 0 1 430 189 Z"/></g>
  <g fill="none" stroke="#3b4454" stroke-width="2.6" opacity=".7"><path d="M100 189 A50 50 0 0 1 200 189"/><path d="M334 189 A50 50 0 0 1 434 189"/></g>

  <!-- wheels -->
  <g id="wheel-r"><circle cx="150" cy="195" r="37" fill="#0b0d12" stroke="#252c37" stroke-width="2"/><circle cx="150" cy="195" r="25" fill="url(#rim)"/><circle cx="150" cy="195" r="20" fill="#a7aeb4"/>
    <g fill="#4a5159"><circle cx="150" cy="184" r="3.2"/><circle cx="160.5" cy="191.7" r="3.2"/><circle cx="156.5" cy="204.1" r="3.2"/><circle cx="143.5" cy="204.1" r="3.2"/><circle cx="139.5" cy="191.7" r="3.2"/></g>
    <circle cx="150" cy="195" r="5.5" fill="#5b636b"/><path d="M126 182 A28 28 0 0 1 144 168" fill="none" stroke="#fff" stroke-width="2" opacity=".14" stroke-linecap="round"/></g>
  <use href="#wheel-r" x="234"/>

  <!-- front end: nose, grille, lamp, bumpers -->
  <path d="M458 122 C478 131 488 146 488 163 L488 182 L470 182 L468 140 Z" fill="#0d1016"/>
  <g fill="url(#chrome)"><rect x="475" y="132" width="11" height="2.6" rx="1.3"/><rect x="475" y="140" width="11.5" height="2.6" rx="1.3"/><rect x="475" y="148" width="12" height="2.6" rx="1.3"/><rect x="475" y="156" width="12" height="2.6" rx="1.3"/><rect x="475" y="164" width="12" height="2.6" rx="1.3"/></g>
  <circle cx="458" cy="152" r="40" fill="url(#halo)"/>
  <circle cx="458" cy="152" r="16.5" fill="url(#chrome)"/><circle cx="458" cy="152" r="12.5" fill="#fff5d2"/><circle cx="458" cy="152" r="9" fill="#f6dd98"/><circle cx="454.5" cy="148.5" r="3.6" fill="#fff" opacity=".9"/>
  <ellipse cx="470" cy="177" rx="4.5" ry="3" fill="#e9a43a"/>
  <rect x="466" y="176" width="34" height="16" rx="8" fill="url(#chrome)"/><rect x="36" y="176" width="34" height="16" rx="8" fill="url(#chrome)"/>
  <!-- rear lamp -->
  <rect x="44" y="112" width="9" height="40" rx="4.5" fill="#b94e43"/><rect x="46" y="115" width="3" height="32" rx="1.5" fill="#ffb3a5" opacity=".65"/><ellipse cx="49" cy="162" rx="4" ry="3" fill="#e9a43a"/>

  <!-- roof sign -->
  <rect x="244" y="38" width="16" height="7" rx="2" fill="#080b10"/>
  <rect x="212" y="18" width="80" height="24" rx="8" fill="#080b10"/>
  <rect x="216" y="21.5" width="72" height="17" rx="5.5" fill="url(#sign)"/>
  <rect x="220" y="23" width="64" height="3.4" rx="1.7" fill="#fff" opacity=".55"/>
  <text x="252" y="35.4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="12.5" letter-spacing="2.4" fill="#2b2316">TAXI</text>
</svg>
